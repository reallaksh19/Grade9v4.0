<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-labelledby="wepk-title wepk-desc"><title id="wepk-title">Kinetic energy from the work done by a constant net force</title><desc id="wepk-desc">Four stages: a trolley pushed by a constant net force over a displacement s from speed u to speed v; the net work written with Newton's second law; the no-time relation for a s; their combination into the change of kinetic energy.</desc><defs><marker id="wepk-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="currentColor"/></marker></defs><g data-g9-stage-id="VIS-WEP-K-V0" font-family="system-ui,sans-serif" font-size="14" fill="currentColor" stroke="currentColor"><text x="16" y="24" stroke="none" font-weight="700">One trolley, one interval</text><line x1="20" y1="110" x2="420" y2="110" stroke-width="2"/><rect x="40" y="80" width="56" height="30" fill="none" stroke-width="2"/><rect x="330" y="80" width="56" height="30" fill="none" stroke-width="2" stroke-dasharray="4 3"/><text x="44" y="70" stroke="none">speed u</text><text x="334" y="70" stroke="none">speed v</text><line x1="68" y1="132" x2="358" y2="132" stroke-width="2" marker-end="url(#wepk-a)"/><text x="190" y="152" stroke="none">displacement s</text></g><g data-g9-stage-id="VIS-WEP-K-V1" font-family="system-ui,sans-serif" font-size="14" fill="currentColor" stroke="currentColor"><text x="16" y="24" stroke="none" font-weight="700">W_net = F_net s = m a s</text><line x1="20" y1="110" x2="420" y2="110" stroke-width="2"/><rect x="40" y="80" width="56" height="30" fill="none" stroke-width="2"/><rect x="330" y="80" width="56" height="30" fill="none" stroke-width="2" stroke-dasharray="4 3"/><text x="44" y="70" stroke="none">speed u</text><text x="334" y="70" stroke="none">speed v</text><line x1="68" y1="132" x2="358" y2="132" stroke-width="2" marker-end="url(#wepk-a)"/><text x="190" y="152" stroke="none">displacement s</text><line x1="100" y1="95" x2="170" y2="95" stroke-width="3" marker-end="url(#wepk-a)"/><text x="104" y="66" stroke="none" font-weight="700">F_net</text><text x="24" y="196" stroke="none">net force along the path: F_net = m a</text></g><g data-g9-stage-id="VIS-WEP-K-V2" font-family="system-ui,sans-serif" font-size="14" fill="currentColor" stroke="currentColor"><text x="16" y="24" stroke="none" font-weight="700">constant a: a s = (v² − u²)/2</text><line x1="20" y1="110" x2="420" y2="110" stroke-width="2"/><rect x="40" y="80" width="56" height="30" fill="none" stroke-width="2"/><rect x="330" y="80" width="56" height="30" fill="none" stroke-width="2" stroke-dasharray="4 3"/><text x="44" y="70" stroke="none">speed u</text><text x="334" y="70" stroke="none">speed v</text><line x1="68" y1="132" x2="358" y2="132" stroke-width="2" marker-end="url(#wepk-a)"/><text x="190" y="152" stroke="none">displacement s</text><line x1="100" y1="95" x2="170" y2="95" stroke-width="3" marker-end="url(#wepk-a)"/><text x="104" y="66" stroke="none" font-weight="700">F_net</text><text x="24" y="196" stroke="none">from v² − u² = 2 a s</text></g><g data-g9-stage-id="VIS-WEP-K-V3" font-family="system-ui,sans-serif" font-size="14" fill="currentColor" stroke="currentColor"><text x="16" y="24" stroke="none" font-weight="700">W_net = ½ m v² − ½ m u² = ΔK</text><line x1="20" y1="110" x2="420" y2="110" stroke-width="2"/><rect x="40" y="80" width="56" height="30" fill="none" stroke-width="2"/><rect x="330" y="80" width="56" height="30" fill="none" stroke-width="2" stroke-dasharray="4 3"/><text x="44" y="70" stroke="none">speed u</text><text x="334" y="70" stroke="none">speed v</text><line x1="68" y1="132" x2="358" y2="132" stroke-width="2" marker-end="url(#wepk-a)"/><text x="190" y="152" stroke="none">displacement s</text><line x1="100" y1="95" x2="170" y2="95" stroke-width="3" marker-end="url(#wepk-a)"/><text x="104" y="66" stroke="none" font-weight="700">F_net</text><text x="24" y="196" stroke="none">from rest (u = 0): K = ½ m v²</text></g></svg>
