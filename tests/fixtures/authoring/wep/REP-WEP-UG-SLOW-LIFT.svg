<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-labelledby="wepu-title wepu-desc"><title id="wepu-title">Gravitational potential energy from a slow lift</title><desc id="wepu-desc">Four stages: a box lifted slowly through height h; the applied force balancing the weight; zero net work in a slow lift; the applied work stored as the increase of gravitational potential energy m g h.</desc><defs><marker id="wepu-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="currentColor"/></marker></defs><g data-g9-stage-id="VIS-WEP-UG-V0" font-family="system-ui,sans-serif" font-size="14" fill="currentColor" stroke="currentColor"><text x="16" y="24" stroke="none" font-weight="700">A slow lift through height h</text><line x1="20" y1="200" x2="200" y2="200" stroke-width="2"/><rect x="70" y="170" width="50" height="30" fill="none" stroke-width="2" stroke-dasharray="4 3"/><rect x="70" y="70" width="50" height="30" fill="none" stroke-width="2"/><line x1="150" y1="188" x2="150" y2="84" stroke-width="2" marker-end="url(#wepu-a)"/><text x="158" y="140" stroke="none">h</text></g><g data-g9-stage-id="VIS-WEP-UG-V1" font-family="system-ui,sans-serif" font-size="14" fill="currentColor" stroke="currentColor"><text x="16" y="24" stroke="none" font-weight="700">Slow: a = 0, applied force = m g</text><line x1="20" y1="200" x2="200" y2="200" stroke-width="2"/><rect x="70" y="170" width="50" height="30" fill="none" stroke-width="2" stroke-dasharray="4 3"/><rect x="70" y="70" width="50" height="30" fill="none" stroke-width="2"/><line x1="150" y1="188" x2="150" y2="84" stroke-width="2" marker-end="url(#wepu-a)"/><text x="158" y="140" stroke="none">h</text><line x1="95" y1="70" x2="95" y2="40" stroke-width="3" marker-end="url(#wepu-a)"/><text x="102" y="48" stroke="none">applied</text><line x1="95" y1="100" x2="95" y2="130" stroke-width="3" marker-end="url(#wepu-a)"/><text x="102" y="126" stroke="none">m g</text><text x="214" y="100" stroke="none">applied force balances</text><text x="214" y="124" stroke="none">the weight m g</text></g><g data-g9-stage-id="VIS-WEP-UG-V2" font-family="system-ui,sans-serif" font-size="14" fill="currentColor" stroke="currentColor"><text x="16" y="24" stroke="none" font-weight="700">Speed unchanged: ΔK = 0</text><line x1="20" y1="200" x2="200" y2="200" stroke-width="2"/><rect x="70" y="170" width="50" height="30" fill="none" stroke-width="2" stroke-dasharray="4 3"/><rect x="70" y="70" width="50" height="30" fill="none" stroke-width="2"/><line x1="150" y1="188" x2="150" y2="84" stroke-width="2" marker-end="url(#wepu-a)"/><text x="158" y="140" stroke="none">h</text><line x1="95" y1="70" x2="95" y2="40" stroke-width="3" marker-end="url(#wepu-a)"/><text x="102" y="48" stroke="none">applied</text><line x1="95" y1="100" x2="95" y2="130" stroke-width="3" marker-end="url(#wepu-a)"/><text x="102" y="126" stroke="none">m g</text><text x="214" y="100" stroke="none">W_gravity = − m g h</text><text x="214" y="124" stroke="none">W_applied = + m g h</text></g><g data-g9-stage-id="VIS-WEP-UG-V3" font-family="system-ui,sans-serif" font-size="14" fill="currentColor" stroke="currentColor"><text x="16" y="24" stroke="none" font-weight="700">ΔU_g = m g h</text><line x1="20" y1="200" x2="200" y2="200" stroke-width="2"/><rect x="70" y="170" width="50" height="30" fill="none" stroke-width="2" stroke-dasharray="4 3"/><rect x="70" y="70" width="50" height="30" fill="none" stroke-width="2"/><line x1="150" y1="188" x2="150" y2="84" stroke-width="2" marker-end="url(#wepu-a)"/><text x="158" y="140" stroke="none">h</text><line x1="95" y1="70" x2="95" y2="40" stroke-width="3" marker-end="url(#wepu-a)"/><text x="102" y="48" stroke="none">applied</text><line x1="95" y1="100" x2="95" y2="130" stroke-width="3" marker-end="url(#wepu-a)"/><text x="102" y="126" stroke="none">m g</text><text x="214" y="100" stroke="none">stored as ΔU_g,</text><text x="214" y="124" stroke="none">not spent on speed</text></g></svg>
