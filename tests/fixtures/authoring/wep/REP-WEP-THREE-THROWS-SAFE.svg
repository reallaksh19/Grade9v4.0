<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 260" role="img" aria-labelledby="wept-title wept-desc">
<title id="wept-title">Three balls thrown from a roof edge at the same speed</title><desc id="wept-desc">A roof 20 m above the ground. From its edge three balls leave at 10 m/s: one straight up, one straight down, one horizontally. Their paths and landing speeds are not shown.</desc>
<defs><marker id="wept-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="currentColor"/></marker></defs>
<g data-g9-stage-id="VIS-WEP-THROWS-V0" font-family="system-ui,sans-serif" font-size="14" fill="currentColor" stroke="currentColor"><text x="16" y="24" stroke="none" font-weight="700">Same speed, three directions</text><rect x="20" y="90" width="150" height="150" fill="none" stroke-width="2"/><line x1="20" y1="240" x2="420" y2="240" stroke-width="2"/><text x="40" y="170" stroke="none">roof, 20 m high</text><circle cx="170" cy="90" r="6" fill="currentColor" stroke="none"/><line x1="170" y1="84" x2="170" y2="40" stroke-width="2" marker-end="url(#wept-a)"/><text x="180" y="50" stroke="none">10 m/s up</text><line x1="176" y1="90" x2="240" y2="90" stroke-width="2" marker-end="url(#wept-a)"/><text x="250" y="94" stroke="none">10 m/s across</text><line x1="170" y1="96" x2="170" y2="140" stroke-width="2" marker-end="url(#wept-a)"/><text x="180" y="132" stroke="none">10 m/s down</text><text x="250" y="230" stroke="none">ground</text></g>
<g data-g9-stage-id="VIS-WEP-THROWS-V1" font-family="system-ui,sans-serif" font-size="14" fill="currentColor" stroke="currentColor"><text x="250" y="160" stroke="none">landing speeds: ?</text></g>
</svg>
